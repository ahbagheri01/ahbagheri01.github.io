  - title: Online Learning in Serverless Computing
    where: Politecnico di Milano, Dec. 2025 - May 2026
    description: >-
      My contribution extends the original NSGD-based autoscaling framework from a single serverless function to realistic workflow-based applications represented as directed acyclic graphs (DAGs). I developed an event-driven graph simulator in which requests enter through a root function, propagate to downstream functions only after actual task completion, and follow probabilistic routing between DAG nodes. The extension introduces shared cluster-wide resource constraints, allowing contention and request rejection to occur at any node, while preserving independent function-instance pools and concurrent execution across the workflow. In addition, the framework tracks both node-level behavior and end-to-end workflow response times, enabling evaluation of cold starts, rejection probability, resource usage, cost, and overall workflow performance under coupled autoscaling decisions.
    badge: Polimi
    code: https://github.com/Wamuhindo/NSGD/tree/DAG/AutoscalerFaasScalarVectorial
    image: /assets/img/papers/serverlessautoscale.png

